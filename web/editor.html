<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mod Takeover Editor</title>
  <link rel="stylesheet" href="/common.css">
</head>

<body class="editor-body">
  <div class="editor-container">
    <div class="editor-toolbar">
      <button id="addTextButton">Add Text</button>
      <button id="addImageButton">Add Image</button>
      <button id="drawButton">Draw</button>
      <button id="undoButton" style="display: none">Undo</button>
      <button id="deleteButton">Delete Selected</button>
    </div>

    <div id="stageWrapper" class="editor-stage-wrapper">
      <main id="stage"></main>
    </div>

    <div id="properties" class="properties hidden">
      <strong>Selected Element</strong>
      <label id="textProperty">Text: <input id="textContent" type="text"></label>
      <label id="imageProperty">Image URL:
        <input id="imageUrl" type="url" placeholder="https://example.com/image.gif">
      </label>
      <label id="colorProperty">Color: <input id="brushColor" type="color" value="#ff0000"></label>
      <label id="brushProperty">Brush: <input id="brushSize" type="range" min="1" max="50" value="10"></label>
      <div id="brushPreview"></div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script src="/editor.js"></script>
</body>

</html>
